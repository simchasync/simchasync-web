# Remote auth settings — MUST mirror production values: `supabase config push`
# compares the WHOLE [auth] section, so unset fields get reset to CLI defaults.
[auth]
site_url = "https://simchasync-web.vercel.app"
additional_redirect_urls = ["https://simchasync-web.vercel.app/auth/phone", "http://localhost:8080/auth/phone", "https://simchasync-web.vercel.app/admin", "http://localhost:8080/admin"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.rate_limit]
# Emails per hour through the custom SMTP (Gmail allows ~500/day)
email_sent = 60

# Branded auth email templates (pushed to the remote project via `supabase config push`)
[auth.email.template.magic_link]
subject = "Your SimchaSync sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your SimchaSync account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your SimchaSync password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've been invited to SimchaSync"
content_path = "./supabase/templates/invite.html"

[functions.ensure-user-onboarding]
verify_jwt = false

[functions.public-chat]
verify_jwt = false

[functions.check-subscription]
verify_jwt = false

[functions.invite-team-member]
verify_jwt = false

# Verifies the caller's JWT internally (must be owner/booking_manager of the event's tenant)
[functions.colleague-booking-request]
verify_jwt = false

# Verifies the caller's JWT internally (must be owner/booking_manager of the event's tenant)
[functions.colleague-event-invite]
verify_jwt = false

# Verifies the caller's JWT internally (must be owner/booking_manager of the tenant)
[functions.send-sms]
verify_jwt = false

# Stripe webhook: called by Stripe with webhook signature, no Supabase JWT
[functions.stripe-webhook]
verify_jwt = false

# Auth "Send email" hook: Supabase calls this without a user JWT (Standard Webhooks only)
[functions.send-auth-email]
verify_jwt = false

[functions.calendar-export]
verify_jwt = false

# Google Calendar OAuth: each validates the caller's Bearer token internally
# (oauth-callback is hit by Google's browser redirect, no Supabase JWT).
[functions.gcal-oauth-start]
verify_jwt = false

[functions.gcal-oauth-callback]
verify_jwt = false

[functions.gcal-sync]
verify_jwt = false

[functions.gcal-disconnect]
verify_jwt = false


# Admin split functions — each verifies auth internally via Bearer token
[functions.admin-tenants]
verify_jwt = false

[functions.admin-billing]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

[functions.admin-roles]
verify_jwt = false

[functions.admin-support]
verify_jwt = false

[functions.admin-audit]
verify_jwt = false

# Work report — called by GitHub Actions cron with Bearer token auth
[functions.send-work-report]
verify_jwt = false
