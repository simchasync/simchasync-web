name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Publishable values only (same as .env.example) — no secrets needed
          VITE_SUPABASE_PROJECT_ID: qxcatdirkfbqitvkuvbu
          VITE_SUPABASE_URL: https://qxcatdirkfbqitvkuvbu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_HNgqLFiTy9P1Ji5h5wBx0w_Sov5mfaP
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HNgqLFiTy9P1Ji5h5wBx0w_Sov5mfaP

      # TODO: add "npx tsc --noEmit" once the ~60 pre-existing unused-variable
      # errors in legacy pages are cleaned up.
